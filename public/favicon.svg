<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Dark container with subtle amber border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Code bracket & Monogram text { E } -->
  <text 
    x="32" 
    y="43" 
    font-family="system-ui, -apple-system, 'JetBrains Mono', 'Segoe UI', monospace" 
    font-size="30" 
    font-weight="800" 
    text-anchor="middle"
    letter-spacing="-0.5"
  >
    <tspan fill="#a1a1aa">{</tspan><tspan fill="url(#goldGrad)" font-weight="900">E</tspan><tspan fill="#a1a1aa">}</tspan>
  </text>
</svg>